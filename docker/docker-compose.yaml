services:
  auth_service_db:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    volumes:
      - ./init-db/:/docker-entrypoint-initdb.d/
      - ./.data/mysql/:/var/lib/mysql
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: true
      MYSQL_USER: auth_service_user
      MYSQL_PASSWORD: auth_service_pw
    ports:
      - "3306:3306"
    networks:
      - auth_service_db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  auth_service_db_migration:
    image: arigaio/atlas:1.3.2-community-alpine@sha256:bcba8c47ea8fee2b8922d9914479efe266e33f376d012e61d18a89cb477dbf0e
    command: >
      schema apply
      --auto-approve
      --url "maria://auth_service_user:auth_service_pw@auth_service_db:3306/auth_service_db"
      --to file:///schema/schema.sql
      --dev-url "maria://auth_service_user:auth_service_pw@auth_service_db:3306/auth_service_dev"
    networks:
      - auth_service_db
    depends_on:
      auth_service_db:
        condition: service_healthy
    volumes:
      - ../schema/database:/schema
  auth_service_http:
    image: auth_service_http:latest
    ports:
      - "3000:3000"
    networks:
      - auth_service_db
    depends_on:
      auth_service_db:
        condition: service_healthy
    environment:
      AUTH_SERVICE_DB_HOST: auth_service_db
      AUTH_SERVICE_DB_PORT: 3306
      AUTH_SERVICE_DB_USER: auth_service_user
      AUTH_SERVICE_DB_PASSWORD: auth_service_pw
      AUTH_SERVICE_DB_NAME: auth_service_db
      AUTH_SERVICE_HTTP_PORT: 3000
    env_file: "http-server.env"

networks:
  auth_service_db:
    driver: bridge
